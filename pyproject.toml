[project]
name = "video-download-king"
version = "0.5.0"
description = "Portable Windows 11 desktop downloader for YouTube and Douyin"
requires-python = ">=3.12"
dependencies = [
    "PySide6==6.11.1",
    "aiohttp>=3.9.0,<4",
    "aiofiles>=23.2.1,<25",
    "aiohttp-socks>=0.10.1,<1",
    "gmssl>=3.2.2,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
